name: CI Pipeline

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  backend-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: animal_adoption
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d animal_adoption"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: test-secret-key
      DEBUG: "False"
      DB_NAME: animal_adoption
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      ALLOWED_HOSTS: localhost,127.0.0.1
      API_DOCS_ENABLED: "True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check code style
        run: flake8 backend/

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate

      - name: Run tests with coverage
        working-directory: backend
        run: pytest --cov --cov-fail-under=80

      - name: Validate OpenAPI schema
        working-directory: backend
        run: python manage.py spectacular --file schema.yml --validate --fail-on-warn

      - name: Build backend image
        run: docker build -t adoptify-backend ./backend

      - name: Build frontend image
        run: docker build -t adoptify-frontend ./frontend
